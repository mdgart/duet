# Duet configuration. Copy to duet.toml and edit.
#
# The roster is a list, not a fixed pair: adding a third voice is these five
# lines, not a refactor. Every participant needs a unique `id` — roles, logs and
# verdicts are keyed by id, so two participants may share a provider.

[[participants]]
id = "sol"
provider = "openai"
model = "gpt-5.6-sol"
badge = "SOL"        # optional, defaults to the uppercased id
color = "cyan"       # rich colour for the CLI gutter

[[participants]]
id = "opus"
provider = "anthropic"
model = "claude-opus-5"
badge = "OPUS"
color = "dark_orange"

# A third voice — same provider as opus, different model. Cross-validation:
# each round one participant proposes and the other two critique independently.
# [[participants]]
# id = "haiku"
# provider = "anthropic"
# model = "claude-haiku-4-5"
# color = "green"

[debate]
max_rounds = 8
min_objection_rounds = 2   # AGREE is rejected before this round (anti-sycophancy)
reopen_limit = 3
stall_rounds = 4           # rounds without a new low before the debate is called stuck
consensus = "unanimous"    # unanimous | quorum
quorum = 1.0               # fraction that must AGREE when consensus = "quorum"
max_output_tokens = 32768  # per-turn cap; every revision re-emits the whole spec

[build]
# Participant ids. coder unset -> first in roster; reviewers unset -> all others.
# coder = "opus"
# reviewers = ["sol", "haiku"]
alternate_roles = false    # true: the coder role rotates through the roster per task
max_review_cycles = 6
max_tool_calls_per_turn = 25
context_budget_tokens = 60000

[budget]
max_usd = 25.0
max_wall_minutes = 90

[sandbox]
runner = "docker"          # docker | local-unsafe
network = "none"           # none | allowlist
network_allowlist = ["pypi.org", "registry.npmjs.org"]

# Cheap non-debate model for repo mapping and deterministic summarisation.
[utility.mapper]
provider = "anthropic"
model = "claude-haiku-4-5"

# Per-model prices, USD per million tokens. Overlays the built-in table.
[pricing."gpt-5.6-sol"]
input_per_mtok = 5.0
output_per_mtok = 30.0

# ---------------------------------------------------------------------------
# Profiles live at ~/.duet/profiles/<name>.toml and are selected with
# --profile <name>. One declaring [[participants]] swaps the whole roster, which
# makes a cheap testing lineup a one-flag change:
#
#   duet new "an idea" --profile cheap
#
# A `cheap` profile shipping small models from both labs — flagship-tier debates
# cost dollars per run, and most of what you are testing is the loop, not the
# models. Keep one participant per lab even when testing: a same-lab roster
# stops exercising the decorrelation the whole design rests on.
