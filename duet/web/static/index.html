<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>duet</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>duet</h1>
    <span class="tag">cross-model debate</span>
  </header>

  <main>
    <aside id="sidebar">
      <button id="new-btn" class="primary">＋ New debate</button>
      <div id="session-list"></div>
    </aside>

    <section id="detail">
      <div id="empty" class="empty">Pick a session, or start a new debate.</div>

      <form id="new-form" hidden>
        <h2>New debate</h2>
        <label>Idea or brief
          <textarea id="idea" rows="4" placeholder="e.g. should we adopt trunk-based development?"></textarea>
        </label>
        <label>Document shape
          <select id="template"></select>
        </label>
        <div class="grid2">
          <label>Roster
            <select id="profile"></select>
          </label>
          <label>Budget cap (USD)
            <input id="budget" type="number" step="0.5" min="0" placeholder="default">
          </label>
        </div>
        <label>Context <span class="hint">(optional — facts the models must treat as settled)</span>
          <textarea id="context" rows="3" placeholder="e.g. We already run Postgres 16."></textarea>
        </label>
        <div class="row">
          <button type="submit" class="primary">Start debate</button>
          <button type="button" id="cancel-new">Cancel</button>
        </div>
      </form>

      <div id="session" hidden>
        <nav id="tabs">
          <button data-tab="debate" class="tab active">Debate</button>
          <button data-tab="document" class="tab">Document</button>
        </nav>

        <div id="tab-debate">
          <div id="session-head"></div>
          <div id="summary"></div>
          <div id="gate"></div>
          <h3>Debate</h3>
          <div id="timeline"></div>
        </div>

        <div id="tab-document" hidden>
          <div id="doc-nav"></div>
          <article id="doc"></article>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
