[project]
name = "duet"
version = "0.4.0"
description = "Cross-model prototyping & coding agent loop (GPT x Claude debate-to-build)"
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = [
    'tomli>=2; python_version < "3.11"',
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.60",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
duet = "duet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["contract: hits real provider APIs; opt in with DUET_CONTRACT=1"]
